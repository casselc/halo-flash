timeout = 1200

# ---- Kernels (src/kernels/core.hip) ------------------------------------------

[[mutant]]
name = "k-hc-combine-scale"
file = "src/kernels/core.hip"
find = '* 2.0f * Sigmoid(inject[s]'
replace = '* 1.0f * Sigmoid(inject[s]'
suite = "gpu"
binary = "gpu_tests"
filter = "FlashNextGpu.TinyModelMatchesReferenceAndTransformers:FlashNextGpu.RandomSequencesMatchReference:Qwen35Gpu.TinyModelMatchesCpuReference"
why = "2*sigmoid centres the scatter weights on 1"

[[mutant]]
name = "k-hc-mix-mean"
file = "src/kernels/core.hip"
find = 'mixed[i] = acc / static_cast<float>(hc);'
replace = 'mixed[i] = acc;'
suite = "gpu"
binary = "gpu_tests"
filter = "FlashNextGpu.TinyModelMatchesReferenceAndTransformers:FlashNextGpu.RandomSequencesMatchReference:Qwen35Gpu.TinyModelMatchesCpuReference"
why = "the mixer averages streams"

[[mutant]]
name = "k-scale-silu-scale"
file = "src/kernels/core.hip"
find = 'x[i] = Silu(x[i] * scale);'
replace = 'x[i] = Silu(x[i]);'
suite = "gpu"
binary = "gpu_tests"
filter = "FlashNextGpu.TinyModelMatchesReferenceAndTransformers:FlashNextGpu.RandomSequencesMatchReference:Qwen35Gpu.TinyModelMatchesCpuReference"
why = "low-rank mixer divides by hc before SiLU"

[[mutant]]
name = "k-ple-gate-sign"
file = "src/kernels/core.hip"
find = '(sc < 0.0f ? -1.0f :'
replace = '(sc < 0.0f ? 1.0f :'
suite = "gpu"
binary = "gpu_tests"
filter = "FlashNextGpu.TinyModelMatchesReferenceAndTransformers:FlashNextGpu.RandomSequencesMatchReference:Qwen35Gpu.TinyModelMatchesCpuReference"
why = "signed square root keeps the similarity's sign"

[[mutant]]
name = "k-ple-conv-history-shift"
file = "src/kernels/core.hip"
find = 'for (std::uint32_t t = 0; t + 1 < hist; ++t)'
replace = 'for (std::uint32_t t = 0; t + 2 < hist; ++t)'
suite = "gpu"
binary = "gpu_tests"
filter = "FlashNextGpu.TinyModelMatchesReferenceAndTransformers:FlashNextGpu.RandomSequencesMatchReference:Qwen35Gpu.TinyModelMatchesCpuReference"
why = "the whole PLE conv history shifts each token"

[[mutant]]
name = "k-qsa-no-relu"
file = "src/kernels/core.hip"
find = 'acc += fmaxf(0.0f, dot);'
replace = 'acc += dot;'
suite = "gpu"
binary = "gpu_tests"
filter = "FlashNextGpu.TinyModelMatchesReferenceAndTransformers:FlashNextGpu.RandomSequencesMatchReference:Qwen35Gpu.TinyModelMatchesCpuReference"
why = "block scores sum ReLU'd per-head dots"

[[mutant]]
name = "k-attention-select-unscaled"
file = "src/kernels/core.hip"
find = 'sc[j] = dot * scale;'
replace = 'sc[j] = dot;'
suite = "gpu"
binary = "gpu_tests"
filter = "FlashNextGpu.TinyModelMatchesReferenceAndTransformers:FlashNextGpu.RandomSequencesMatchReference:Qwen35Gpu.TinyModelMatchesCpuReference"
why = "softmax temperature 1/sqrt(head_dim)"

[[mutant]]
name = "k-pool-block-drops-token"
file = "src/kernels/core.hip"
find = 'for (std::uint32_t t = 0; t < ratio; ++t) acc +='
replace = 'for (std::uint32_t t = 0; t + 1 < ratio; ++t) acc +='
suite = "gpu"
binary = "gpu_tests"
filter = "FlashNextGpu.TinyModelMatchesReferenceAndTransformers:FlashNextGpu.RandomSequencesMatchReference:Qwen35Gpu.TinyModelMatchesCpuReference"
