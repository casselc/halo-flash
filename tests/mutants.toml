# Planted mutants: defects the tests must catch, for code Mull cannot mutate
# (GPU kernels compiled to HSACO) and for engine state the tests were written
# against. Run with tools/mutants.py; every mutant must be killed. Add one
# whenever a test is written for a bug class, and keep `why` specific.
#
# `find` must occur exactly once in `file`. TOML literal strings ('...')
# keep code verbatim.

[suite.cpu-asan]
build_dir = "build/cpu-asan"
env = []

[suite.gpu]
build_dir = "build/gpu"
env = ["HALO_TINY_HF_DIR", "HALO_TINY_QWEN35_DIR", "HALO_SMALL_QUANT_DIR", "HALO_DECIDER_MODELS_DIR"]

[suite.cpu]
build_dir = "build/cpu-debug"

# Filters. Directed tests first: --gtest_fail_fast stops before Hegel shrinks.
#   forward: tiny Flash-Next vs reference + transformers, random sequences, tiny Qwen3.5
#   state:   snapshots, reset, prefill
#   quant:   every matvec format vs CPU dequantization

# ---- Flash-Next engine (src/engine/flash_next_gpu.cpp) ----------------------

