find = 'F16(U16(b)) + F16(U16(b + 2))'
replace = 'F16(U16(b)) - F16(U16(b + 2))'
suite = "gpu"
binary = "gpu_tests"
filter = "GpuQuant.*"
why = "Q5_1 adds its block minimum"

[[mutant]]
name = "k-iq4nl-table"
file = "src/kernels/core.hip"
find = '-127, -104'
replace = '-127, -103'
suite = "gpu"
binary = "gpu_tests"
filter = "GpuQuant.*"
why = "one IQ4_NL codebook entry off by one"
