# Planted mutants: defects the tests must catch, for code Mull cannot mutate
# (GPU kernels compiled to HSACO) and for engine state the tests were written
# against. Run with tools/mutants.py; every mutant must be killed. Add one
# whenever a test is written for a bug class, and keep `why` specific.
#
# `find` must occur exactly once in `file`. TOML literal strings ('...')
# keep code verbatim.

[suite.cpu-asan]
build_dir = "build/cpu-asan"
env = []

[suite.gpu]
build_dir = "build/gpu"
env = ["HALO_TINY_HF_DIR", "HALO_TINY_QWEN35_DIR", "HALO_SMALL_QUANT_DIR", "HALO_DECIDER_MODELS_DIR"]

[suite.cpu-tsan]
build_dir = "build/cpu-tsan"
env = []

[suite.cpu]
build_dir = "build/cpu-debug"

# The small quantized model only (session / slice exactness; take the GPU lock).
[suite.gpu-small]
build_dir = "build/gpu"
env = ["HALO_SMALL_QUANT_DIR"]

# The real model and its MTP sidecar (one model instance: take the GPU lock).
[suite.gpu-real]
build_dir = "build/gpu"
env = ["HALO_FLASH_NEXT_GGUF", "HALO_FLASH_NEXT_MTP", "HALO_SMALL_QUANT_DIR"]

# halo-scope under ASan+UBSan: the cpu-asan preset with -DHALO_SCOPE=ON
# (cmake --preset cpu-asan -B build/scope-asan -DHALO_SCOPE=ON); the filters
# below need no libchdb. libchdb is not ASan-built and crashes under it: run
# with HALO_SCOPE_LIBCHDB=/nonexistent and the nix env (.nix-env.sh) sourced.
[suite.scope-asan]
build_dir = "build/scope-asan"
env = []

# Filters. Directed tests first: --gtest_fail_fast stops before Hegel shrinks.
#   forward: tiny Flash-Next vs reference + transformers, random sequences, tiny Qwen3.5
#   state:   snapshots, reset, prefill
#   quant:   every matvec format vs CPU dequantization

