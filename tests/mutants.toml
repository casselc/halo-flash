[[mutant]]
name = "k-gdn-decay-no-dt"
file = "src/kernels/core.hip"
find = 'expf(a[h] * Softplus(alpha[h] + dt[h]))'
replace = 'expf(a[h] * Softplus(alpha[h]))'
